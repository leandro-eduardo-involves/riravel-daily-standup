<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiRavel Daily · Setup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{min-height:100vh;background:#08080D;font-family:'DM Sans',system-ui,sans-serif;color:#E2E2E8;display:flex;align-items:flex-start;justify-content:center;padding:3.5rem 1.5rem 2.5rem}
.wrap{max-width:28rem;width:100%;text-align:center}
.sub{font-size:.8rem;letter-spacing:.25rem;text-transform:uppercase;color:#585868;margin-bottom:.4rem}
h1{font-size:1.8rem;font-weight:700;margin-bottom:2rem;background:linear-gradient(135deg,#E2E2E8,#8B8B9E);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bm{display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,#3A7BE8,#5B5BF0);color:#fff;padding:1rem 2rem;border-radius:.625rem;font-size:1.1rem;font-weight:700;text-decoration:none;cursor:grab;transition:all .15s;font-family:inherit;margin-bottom:.75rem}
.bm:hover{filter:brightness(1.15)}
.hint{font-size:.85rem;color:#585868;margin-bottom:2.25rem}
.how{text-align:left;background:#1A1A28;border:1px solid #2A2A3D;border-radius:.625rem;padding:1.25rem 1.5rem;font-size:1rem;color:#8B8B9E;line-height:2.2}
.num{color:#3A7BE8;font-weight:700;margin-right:.15rem}
.how b{color:#B0B0C0}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub">RiRavel</div>
  <h1>Daily Stand-up</h1>
  <a class="bm" href="javascript:void(function(){if(document.getElementById('sf-r')){var e=document.getElementById('sf-r');e.remove();return;}var r=document.createElement('div');r.id='sf-r';r.style.cssText='position:fixed;top:8px;left:8px;width:300px;height:70vh;z-index:999999;border-radius:10px;overflow:hidden;box-shadow:4px 0 32px rgba(0,0,0,.5);border:1px solid %232A2A3D;display:flex;flex-direction:column;resize:both;min-width:280px;max-width:500px;min-height:300px;max-height:calc(100vh - 16px);background:%2314141F;';var b=document.createElement('div');b.id='sf-b';b.style.cssText='background:%2314141F;padding:6px 10px;display:flex;align-items:center;cursor:move;user-select:none;border-bottom:1px solid %232A2A3D;flex-shrink:0;transition:background .2s,border-color .2s;';b.innerHTML='<span id=sf-t style=%22color:%238B8B9E;font-size:10px;font-weight:600;flex:1;letter-spacing:2px;font-family:monospace;transition:color .2s%22>\u23f1 STAND-UP</span><button id=sf-cl style=%22background:none;border:none;color:%23585868;font-size:16px;cursor:pointer;padding:0 5px;font-family:monospace;transition:color .2s%22>\u00d7</button>';var f=document.createElement('iframe');f.id='sf-f';f.src='https://leandro-eduardo-involves.github.io/riravel-daily-standup/';f.style.cssText='flex:1;border:none;background:%2308080D;width:100%25;transition:background .2s;';f.setAttribute('allow','autoplay');r.appendChild(b);r.appendChild(f);document.body.appendChild(r);document.getElementById('sf-cl').onclick=function(){r.remove();};window.addEventListener('message',function(e){if(e.data&&e.data.standupFilter){var cb=document.getElementById('checkbox-id-'+e.data.name+'-'+e.data.qf);if(cb){cb.click();}return;}if(e.data&&e.data.standupTheme){var L=e.data.standupTheme==='light';var br=document.getElementById('sf-b');var sp=document.getElementById('sf-t');var fr=document.getElementById('sf-f');var rt=document.getElementById('sf-r');if(br){br.style.background=L?'%23F2F3F5':'%2314141F';br.style.borderBottom='1px solid '+(L?'%23E1E3E8':'%232A2A3D');}if(sp)sp.style.color=L?'%236B7280':'%238B8B9E';if(fr)fr.style.background=L?'%23F2F3F5':'%2308080D';if(rt){rt.style.background=L?'%23F2F3F5':'%2314141F';rt.style.borderColor=L?'%23E1E3E8':'%232A2A3D';rt.style.boxShadow=L?'4px 0 32px rgba(0,0,0,.15)':'4px 0 32px rgba(0,0,0,.5)';}var cl=document.getElementById('sf-cl');if(cl)cl.style.color=L?'%239CA3AF':'%23585868';}});var ox,oy,dr=false;b.onmousedown=function(e){if(e.target.tagName==='BUTTON')return;dr=true;var rc=r.getBoundingClientRect();ox=e.clientX-rc.left;oy=e.clientY-rc.top;r.style.left=rc.left+'px';r.style.top=rc.top+'px';};document.addEventListener('mousemove',function(e){if(!dr)return;r.style.left=Math.max(0,e.clientX-ox)+'px';r.style.top=Math.max(0,e.clientY-oy)+'px';});document.addEventListener('mouseup',function(){dr=false;});}())">⏱ Stand-up</a>
  <div class="hint">↑ Arraste este botão pra barra de favoritos</div>
  <div class="how">
    <span class="num">1.</span> Arraste o botão pra <b>barra de favoritos</b><br>
    <span class="num">2.</span> Abra o <b>Jira</b><br>
    <span class="num">3.</span> Clique em <b>⏱ Stand-up</b> nos favoritos<br>
    <span class="num">4.</span> Arraste a barra pra <b>mover</b> o painel<br>
    <span class="num">5.</span> <b>×</b> fecha · clique de novo = toggle
  </div>
</div>
</body>
</html>
