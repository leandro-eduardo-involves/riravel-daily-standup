<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiRavel Daily · Stand-up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080D;--card:#1A1A28;--border:#2A2A3D;--txt:#E2E2E8;--sub:#585868;--dim:#3A3A4A;--blue:#3A7BE8;--font:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;--pip-bg:#1A1A2E;--sk-bg:#0E0E16;--sk-border:#1A1A24;--dis:#2A2A3A;--check:#10B981;--sb-thumb:#161620;--sb-track:transparent}
.light{--bg:#F2F3F5;--card:#FFFFFF;--border:#E1E3E8;--txt:#1A1A2E;--sub:#6B7280;--dim:#7B8394;--blue:#3A7BE8;--pip-bg:#E8EBF0;--sk-bg:#F0F1F4;--sk-border:#D1D5DB;--dis:#C0C4CC;--check:#059669;--sb-thumb:#D4D7DD;--sb-track:#F0F1F4}
html,body{background:var(--bg)}html,body,#app{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
.light{scrollbar-color:#B0B5BE #E8EAF0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:10px}
.light ::-webkit-scrollbar-thumb{background:#B0B5BE}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-resizer{background:var(--card);border:1px solid var(--border);border-radius:2px}
.light .ri{background:#FFF;border-color:#E1E3E8}



.light .ghost{background:#FFF;color:#6B7280;border-color:#E1E3E8}
.light .sbtn-r{background:#FEE2E2;border-color:#FECACA;color:#DC2626}
.light .sbtn-u{background:#D1FAE5;border-color:#A7F3D0;color:#059669}
.light .hdr h1{background:linear-gradient(135deg,#1A1A2E,#4B5563);-webkit-background-clip:text}
.light .td{color:#1A1A2E}
.light .td.ot{color:#DC2626;text-shadow:none}
.light .td.wa{color:#D97706}
.light .pb{background:#E5E7EB}
.light .mute{border-color:#E1E3E8}
.light .tp-btn{background:#FFF;border-color:#E1E3E8;color:#4B5563}
.light .tp-val{background:#FFF;border-color:#E1E3E8;color:#4B5563}
body{background:var(--bg);font-family:var(--font);color:var(--txt);padding:0;font-size:16px;margin:0}
#app{position:relative;z-index:1;width:100%;max-width:380px;margin:0 auto;padding:1.5rem .875rem 1rem}
.phase{display:none}.phase.vis{display:block}
.hdr{text-align:center;margin-bottom:20px}
.hdr-sub{font-size:.7rem;letter-spacing:5px;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
.hdr h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#E2E2E8,#8B8B9E);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow-x:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font-family:inherit;cursor:pointer;transition:transform .15s;font-weight:600;border:none;border-radius:.625rem;padding:.75rem 1.5rem;font-size:.875rem}
.btn:active{transform:scale(.97)}
.btn:hover{opacity:.85}
.btn-p{background:linear-gradient(135deg,#3A7BE8,#5B5BF0);color:#fff}
.btn-p:hover{opacity:1;filter:brightness(1.15)}
.btn-s{background:var(--card);color:var(--sub);border:1px solid var(--border)}
.btn-s:hover{opacity:1;border-color:var(--sub)}
.btn-play{background:var(--card)!important;color:var(--check)!important;border-color:var(--check)!important}
.btn-play:hover{background:var(--border)!important}
.btn-g{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.btn-g:hover{opacity:1;filter:brightness(1.1)}
.btn-sm{padding:.625rem 1rem;font-size:.8rem;border-radius:.5rem}
.ghost{background:var(--card);color:var(--sub);border:1px solid var(--border);border-radius:.5rem;padding:.625rem .875rem;font-size:.8rem;font-family:inherit;cursor:pointer;font-weight:600}
.ghost:hover{border-color:var(--sub)}
.mute{position:absolute;top:1.5rem;right:.8rem;background:none;border:1px solid var(--border);border-radius:.375rem;padding:.25rem .5rem;cursor:pointer;font-size:.875rem;font-family:inherit;transition:border-color .15s}
.mute:hover{border-color:var(--sub)}
.tp{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
.tp-btn{font-family:inherit;cursor:pointer;transition:border-color .15s;font-weight:700;font-size:14px;width:22px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--sub);display:flex;align-items:center;justify-content:center}
.tp-btn:hover{border-color:var(--sub)}
.tp-val{font-family:var(--mono);font-weight:600;font-size:16px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:#A0A0B0;padding:3px 12px;cursor:pointer;min-width:65px;text-align:center;letter-spacing:1px}
.tp-edit{font-family:var(--mono);font-weight:600;font-size:16px;width:30px;text-align:center;background:var(--card);border:1px solid var(--blue);border-radius:5px;color:var(--blue);padding:3px 2px;outline:none}
.tp-colon{font-weight:700;font-size:16px;color:var(--blue);font-family:var(--mono)}
/* Idle: vertical member list */
.mlist{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.mitem{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;transition:all .2s;user-select:none}
.mitem.off{background:#0E0E16;border-color:#1A1A24;opacity:.4}
.mitem .mn{font-size:.85rem;flex:1;color:#B0B0C0}
.mitem.off .mn{color:var(--dim);text-decoration:line-through}
.top-zone{text-align:center;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:8px}
/* Ready list */
.rlist{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.ri{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:grab;transition:transform .15s,opacity .15s;user-select:none}
.ri.dragging{opacity:.4;transform:scale(.95)}
.sbtn{font-family:inherit;cursor:pointer;font-weight:600;font-size:11px;padding:2px 0;border-radius:4px;white-space:nowrap;width:22px;text-align:center;transition:opacity .15s}
.sbtn:hover{opacity:.7}
.sbtn-r{background:#EF444418;border:1px solid #EF444433;color:#EF4444}
.sbtn-u{background:#10B98118;border:1px solid #10B98133;color:var(--check)}
.sk-item{display:flex;align-items:center;gap:8px;background:#0E0E16;border:1px solid #1A1A24;border-radius:8px;padding:6px 12px;opacity:.6}
/* Running */
.obar{display:flex;justify-content:center;gap:3px;margin-bottom:16px;flex-wrap:wrap}
.opip{display:flex;align-items:center;gap:3px;padding:3px 5px;border-radius:5px;border:1px solid transparent}
.ccard{text-align:center;margin-bottom:16px;padding:18px 14px;border-radius:12px}
.td{text-align:center;margin-bottom:.5rem;font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;transition:color .5s;font-family:var(--mono)}
.td.ot{color:#EF4444;text-shadow:0 0 30px rgba(239,68,68,.4)}
.td.wa{color:#F59E0B}
.td.cp{animation:countPulse 1s infinite}
.tu{font-size:10px;color:#EF4444;letter-spacing:3px;text-transform:uppercase;text-align:center;animation:pulse 1s infinite;margin-bottom:10px}
.pb{height:3px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow-x:hidden}
.pf{height:100%;border-radius:2px;transition:width 1s linear,background .5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes countPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.02)}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div class="hdr-sub">RiRavel</div><h1>Daily Stand-up</h1></div>
  <button class="mute" id="muteBtn" onclick="toggleMute()" style="color:var(--sub)">🔊</button>
  <button class="mute" id="themeBtn" onclick="toggleTheme()" style="color:var(--sub);right:auto;left:.8rem">🌙</button>
  <div id="p-idle" class="phase vis"></div>
  <div id="p-shuf" class="phase"></div>
  <div id="p-ready" class="phase"></div>
  <div id="p-run" class="phase"></div>
  <div id="p-done" class="phase"></div>
</div>
<script>
const T=[
  {n:"Augusto Viganigo",i:"AV",c:"#3A7BE8",qf:1220,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/70121:dc335417-e52e-4fa3-90bc-2c2bb6e750b2/54902099-22a3-44db-b031-22f3bcf9107a/128"},
  {n:"Bruna Goncalves",i:"BG",c:"#8B5CF6",sd:true,qf:1221,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/5eb01aeaf235020b84ecc0b5/360bbc3f-ad2f-49e2-8cd2-72c2fb851cea/128"},
  {n:"Crhistopher Lenhard",i:"CL",c:"#10B981",qf:1222,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/60c8bd70c90cb20068bf12c9/41094b9a-70d8-4414-865d-7d815f3aa031/128"},
  {n:"Ivan Fretta",i:"IF",c:"#6366F1",sd:true,qf:1258,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/611bc5184016870069171c23/1e9fac0b-2c66-4936-a5bf-10ad40d79bff/128"},
  {n:"Leandro Eduardo",i:"LE",c:"#E85D3A",qf:1219,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/712020:9cd70667-6799-41b5-8fef-7e29d8af3329/22ef0fb6-d322-454a-801d-b08b12c60373/128"},
  {n:"Matheus Soares",i:"MS",c:"#F59E0B",qf:1218,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/70121:3143784c-286c-4812-942c-850bbf958185/26912763-c3e3-40cd-8025-f27283a900dd/128"},
  {n:"Mauricio Vieira de Souza",i:"MV",c:"#06B6D4",qf:1224,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/70121:227f685c-a245-4070-a0e7-f19663e590ad/8d5a8cb0-351b-4edc-89c2-450cf4c3f5d5/128"},
  {n:"Patrick Kochan",i:"PK",c:"#EC4899",qf:1223,img:"https://avatar-management--avatars.us-west-2.prod.public.atl-paas.net/712020:d527ceb6-1b67-49a6-b764-8fbe9f656346/b92cd4db-c8a7-4cc8-b736-2491f64b9d25/128"},
];
const BOARD_URL="https://involves.atlassian.net/jira/software/c/projects/RIR/boards/413";
const MIN=30,MAX=600,STEP=30;
let dur=120,order=[...T],skip=defSkip(),idx=0,time=120,paused=false,alerted=false,muted=false,editing=false,tI=null,sI=null;
const $=id=>document.getElementById(id);
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function defSkip(){return new Set(T.map((p,i)=>p.sd?i:null).filter(i=>i!==null));}
function act(){return order.filter((_,i)=>!skip.has(i));}
function skList(){return order.map((p,i)=>({...p,oi:i})).filter((_,i)=>skip.has(i));}
function av(p,sz,gray){const bg=gray?"var(--dim)":p.c;const inner=(!gray&&p.img)?`<img src="${p.img}" alt="">`:p.i;return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz<25?9:sz<35?10:20}px;background:${bg}">${inner}</div>`;}
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTick(){if(muted)return;try{const c=getCtx(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.value=600;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.start(c.currentTime);o.stop(c.currentTime+.08);}catch(e){}}
function playAlert(){if(muted)return;try{const c=getCtx(),t=c.currentTime;const b=(s,f,d,v)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d);};b(t,660,.12,.15);b(t+.18,660,.12,.15);b(t+.36,880,.25,.18);}catch(e){}}
function toggleMute(){muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";$("muteBtn").style.color=muted?"#EF4444":"var(--sub)";}
function applyFilter(person){try{window.parent.postMessage({standupFilter:true,qf:person.qf,name:person.n},"*");}catch(e){}}
function clearFilter(person){try{window.parent.postMessage({standupClear:true,qf:person.qf,name:person.n},"*");}catch(e){}}
function clearAllFilters(){act().forEach(p=>clearFilter(p));}
function toggleTheme(){document.documentElement.classList.toggle("light");document.body.classList.toggle("light");const isLight=document.body.classList.contains("light");$("themeBtn").textContent=isLight?"☀️":"🌙";try{localStorage.setItem("standup-theme",isLight?"light":"dark");}catch(e){}try{window.parent.postMessage({standupTheme:isLight?"light":"dark"},"*");}catch(e){}}
function loadTheme(){try{const t=localStorage.getItem("standup-theme");if(t==="light"){document.documentElement.classList.add("light");document.body.classList.add("light");$("themeBtn").textContent="☀️";}try{window.parent.postMessage({standupTheme:t||"dark"},"*");}catch(e){}}catch(e){}}
loadTheme();
function show(id){["idle","shuf","ready","run","done"].forEach(p=>{$("p-"+p).className="phase"+(p===id?" vis":"");});}
function tpHTML(){return`<div class="tp"><button class="tp-btn" onclick="chgDur(-1)" ${dur<=MIN?'style="opacity:.3;cursor:not-allowed" disabled':""}>−</button><button class="tp-val" onclick="startEdit()">${fmt(dur)}</button><button class="tp-btn" onclick="chgDur(1)" ${dur>=MAX?'style="opacity:.3;cursor:not-allowed" disabled':""}>+</button></div>`;}
function tpEditHTML(){const m=String(Math.floor(dur/60)).padStart(2,"0"),s=String(dur%60).padStart(2,"0");return`<div class="tp"><button class="tp-btn" style="opacity:.3" disabled>−</button><div style="display:flex;align-items:center;gap:3px"><input id="tp-min" class="tp-edit" value="${m}" maxlength="2" oninput="onDigit(this,'min')" onkeydown="editKey(event,'min')" onblur="blurEdit()" onfocus="this.select()"><span class="tp-colon">:</span><input id="tp-sec" class="tp-edit" value="${s}" maxlength="2" oninput="onDigit(this,'sec')" onkeydown="editKey(event,'sec')" onblur="blurEdit()" onfocus="this.select()"></div><button class="tp-btn" style="opacity:.3" disabled>+</button></div>`;}
function chgDur(dir){dur=Math.max(MIN,Math.min(MAX,dur+dir*STEP));time=dur;rerender();}
function startEdit(){editing=true;rerender();setTimeout(()=>{const el=$("tp-min");if(el){el.focus();el.select();}},50);}
function onDigit(el,field){el.value=el.value.replace(/\D/g,"").slice(0,2);if(field==="min"&&el.value.length===2){$("tp-sec").focus();$("tp-sec").select();}}
function editKey(e,field){if(e.key==="Enter")commitEdit();if(e.key==="Tab"&&field==="min"){e.preventDefault();$("tp-sec").focus();$("tp-sec").select();}if(e.key==="Escape"){editing=false;rerender();}}
function blurEdit(){setTimeout(()=>{const ae=document.activeElement;if(ae&&(ae.id==="tp-min"||ae.id==="tp-sec"))return;if(editing)commitEdit();},100);}
function commitEdit(){const mEl=$("tp-min"),sEl=$("tp-sec");if(!mEl||!sEl){editing=false;rerender();return;}dur=Math.max(MIN,Math.min(MAX,(parseInt(mEl.value)||0)*60+(parseInt(sEl.value)||0)));time=dur;editing=false;rerender();}
function rerender(){renderReady();}
function togSkip(i){
  if(skip.has(i)){skip.delete(i);}else{skip.add(i);}
  const actives=order.filter((_,j)=>!skip.has(j));
  const skipped=order.filter((_,j)=>skip.has(j));
  order=[...actives,...skipped];
  skip=new Set(order.map((_,j)=>j>=actives.length?j:null).filter(j=>j!==null));
  rerender();
}

// IDLE — vertical list
function renderIdle(){
  const active=T.filter((_,i)=>!skip.has(i));
  const skipped=T.map((p,i)=>({...p,idx:i})).filter((_,i)=>skip.has(i));
  $("p-idle").innerHTML=`${editing?tpEditHTML():tpHTML()}
    <div style="font-size:10px;color:var(--dim);margin-bottom:10px;text-align:center">Click to toggle</div>
    <div class="mlist">
      ${active.map((p,i)=>{const gi=T.indexOf(p);return`<div class="mitem" onclick="togSkip(${gi})">${av(p,26)}<span class="mn">${p.n}</span></div>`;}).join("")}
      ${skipped.length?skipped.map(p=>`<div class="mitem off" onclick="togSkip(${p.idx})">${av(p,26,true)}<span class="mn">${p.n}</span></div>`).join(""):""}
    </div>
    <div class="row"><button class="btn btn-p" onclick="doShuf()" ${T.length-skip.size<2?'disabled style="opacity:.35;cursor:not-allowed;box-shadow:none"':""}>🎲 Shuffle</button><button class="btn btn-s" onclick="keepOrd()">Keep order →</button></div>`;
  show("idle");
}
function doShuf(){
  const actives=order.filter((_,i)=>!skip.has(i));
  const skips=order.filter((_,i)=>skip.has(i));
  order=[...shuf(actives),...skips];
  skip=new Set(order.map((_,i)=>i>=actives.length?i:null).filter(i=>i!==null));
  idx=0;renderReady();
}
function keepOrd(){
  const sn=new Set(order.filter((_,i)=>skip.has(i)).map(p=>p.n));
  const actives=T.filter(p=>!sn.has(p.n));
  const skips=T.filter(p=>sn.has(p.n));
  order=[...actives,...skips];
  skip=new Set(order.map((_,i)=>i>=actives.length?i:null).filter(i=>i!==null));
  idx=0;renderReady();
}
let dFrom=null;
function renderReady(){
  const a=act(),sl=skList();
  $("p-ready").innerHTML=`<div class="top-zone">${editing?tpEditHTML():tpHTML()}<div style="font-size:13px;color:var(--sub)">Drag to reorder · Click ✕ to skip</div></div>
    <div class="rlist" id="dragList" style="margin-bottom:6px">${a.map((p,aI)=>{const oi=order.indexOf(p);return`<div class="ri" draggable="true" data-oi="${oi}"><span style="font-size:12px;color:var(--dim);width:8px">⠿</span><span class="ri-num" style="font-size:12px;color:var(--dim);font-weight:700;width:12px">${aI+1}</span>${av(p,30)}<span style="font-size:14px;flex:1;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.n}</span><button class="sbtn sbtn-r" onclick="togSkip(${oi})">✕</button></div>`;}).join("")}</div>
    ${sl.length?`<div class="rlist" style="margin-bottom:6px"><div style="font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin:6px 0 4px;text-align:center">Skipped</div>${sl.map(p=>`<div class="ri" style="cursor:default;border-color:var(--sk-border);background:var(--sk-bg)">${av(p,30,true)}<span style="font-size:14px;flex:1;color:var(--dim);overflow-x:hidden;text-overflow:ellipsis;white-space:nowrap">${p.n}</span><button class="sbtn sbtn-u" onclick="togSkip(${p.oi})">↩</button></div>`).join("")}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn btn-s btn-sm" onclick="doShuf()" ${a.length<2?'disabled style="opacity:.35;cursor:not-allowed"':""}>🎲 Shuffle</button><button class="btn btn-g btn-sm" onclick="go()" ${a.length===0?'disabled style="opacity:.4;cursor:not-allowed"':""}>▶ Start (${a.length})</button></div>`;
  show("ready");
  const list=$("dragList");if(!list)return;
  list.querySelectorAll('.ri').forEach(el=>{
    el.addEventListener('dragstart',e=>{dFrom=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    el.addEventListener('dragover',e=>{e.preventDefault();if(!dFrom||dFrom===el)return;const rect=el.getBoundingClientRect(),mid=rect.top+rect.height/2;if(e.clientY<mid)list.insertBefore(dFrom,el);else list.insertBefore(dFrom,el.nextSibling);updNums();});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');const nw=[];list.querySelectorAll('.ri').forEach(r=>nw.push(order[parseInt(r.dataset.oi)]));const no=[];let ai=0;order.forEach((_,i)=>{if(skip.has(i))no.push(order[i]);else no.push(nw[ai++]);});order=no;dFrom=null;renderReady();});
  });
}
function updNums(){$("dragList").querySelectorAll('.ri-num').forEach((el,i)=>el.textContent=i+1);}
function go(){if(!act().length)return;idx=0;time=dur;paused=false;alerted=false;clearAllFilters();renderRun();startClk();applyFilter(act()[0]);}
function startClk(){clearInterval(tI);tI=setInterval(()=>{if(paused)return;time--;if(time>0&&time<=10)playTick();if(time<=0){time=0;clearInterval(tI);if(!alerted){playAlert();alerted=true;}}updTimer();},1000);}
function renderRun(){
  const sl=skList();
  $("p-run").innerHTML=`<div class="top-zone"><div class="td" id="tnum"></div><div class="tu" id="tumsg" style="display:none">Time's up!</div><div class="pb" id="pbw" style="width:100%"><div class="pf" id="pf"></div></div></div>
    <div class="rlist" id="runList" style="margin-bottom:6px"></div>
    ${sl.length?`<div class="rlist" style="margin-bottom:6px"><div style="font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin:6px 0 4px;text-align:center">Skipped</div>${sl.map(p=>`<div class="ri" style="cursor:default;opacity:.5;border-color:var(--sk-border);background:var(--sk-bg)">${av(p,30,true)}<span style="font-size:14px;flex:1;color:var(--dim);overflow-x:hidden;text-overflow:ellipsis;white-space:nowrap">${p.n}</span></div>`).join("")}</div>`:""}
    <div class="row" style="gap:6px;margin-top:12px"><button class="btn btn-s btn-sm" id="bprev" onclick="prev()">←</button><button class="btn btn-s btn-sm" id="bpause" onclick="tpause()" style="width:44px;height:40px;text-align:center;display:inline-flex;align-items:center;justify-content:center">⏸</button><button class="btn btn-p btn-sm" id="bnxt" onclick="nxt()" style="min-width:95px">Next →</button><button class="ghost" onclick="reset()">Reset</button></div>`;
  show("run");updRun();
}
function updRun(){
  const a=act(),cur=a[idx];
  $("runList").innerHTML=a.map((p,i)=>{
    const done=i<idx,active=i===idx;
    const bg=active?`background:linear-gradient(135deg,${p.c}15,${p.c}08);border-color:${p.c}44`:"";
    const op=active?1:done?.45:.55;
    return`<div class="ri" style="cursor:default;opacity:${op};${bg}">
      <span style="font-size:12px;color:${done?'var(--check)':active?p.c:'var(--dim)'};font-weight:700;width:12px">${done?'✓':active?'►':i+1}</span>
      ${av(p,30)}<span style="font-size:14px;flex:1;color:var(--txt);overflow-x:hidden;text-overflow:ellipsis;white-space:nowrap">${p.n}</span>
      ${active?`<span style="font-size:12px;color:var(--sub)">${idx+1}/${a.length}</span>`:""}</div>`;
  }).join("");
  $("bnxt").textContent=idx===a.length-1?"Finish →":"Next →";
  $("bprev").style.color=idx===0?"var(--dis)":"var(--sub)";$("bprev").style.cursor=idx===0?"not-allowed":"pointer";
  updTimer();
}
function updTimer(){
  const a=act(),cur=a[idx],tn=$("tnum");tn.textContent=fmt(time);let cls="td";if(time===0)cls+=" ot";else if(time<=30)cls+=" wa";if(time>0&&time<=10)cls+=" cp";tn.className=cls;
  $("tumsg").style.display=time===0?"block":"none";
  $("pf").style.width=((dur-time)/dur)*100+"%";$("pf").style.background=time===0?"#EF4444":time<=30?"#F59E0B":cur.c;
  const bp=$("bpause");if(bp){bp.style.color=time===0?"var(--dis)":"var(--sub)";bp.style.cursor=time===0?"not-allowed":"pointer";}
}
function tpause(){if(time===0)return;paused=!paused;const b=$("bpause");if(paused){b.textContent='▶';b.classList.add('btn-play');}else{b.textContent='⏸';b.classList.remove('btn-play');}}
function nxt(){const a=act();if(idx<a.length-1){clearFilter(a[idx]);clearInterval(tI);idx++;time=dur;paused=false;alerted=false;resetPause();updRun();startClk();applyFilter(a[idx]);}else{clearFilter(a[idx]);clearInterval(tI);renderDone();}}
function prev(){if(idx>0){clearFilter(act()[idx]);clearInterval(tI);idx--;time=dur;paused=false;alerted=false;resetPause();updRun();startClk();applyFilter(act()[idx]);}}
function resetPause(){const b=$("bpause");if(b){b.textContent='⏸';b.classList.remove('btn-play');}}
function renderDone(){
  const a=act(),sl=skList();
  $("p-done").innerHTML=`<div class="top-zone"><div style="font-size:36px;margin-bottom:4px">🎉</div><div style="font-size:16px;font-weight:700">Stand-up complete!</div><div style="font-size:12px;color:var(--sub)">Nice work, team RiRavel</div></div>
    <div class="rlist" style="margin-bottom:6px">${a.map((p,i)=>`<div class="ri" style="cursor:default"><span style="font-size:12px;color:var(--check);font-weight:700;width:12px">✓</span>${av(p,30)}<span style="font-size:14px;flex:1">${p.n}</span></div>`).join("")}</div>
    ${sl.length?`<div class="rlist" style="margin-bottom:6px"><div style="font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin:6px 0 4px;text-align:center">Skipped</div>${sl.map(p=>`<div class="ri" style="cursor:default;opacity:.5;border-color:var(--sk-border);background:var(--sk-bg)">${av(p,30,true)}<span style="font-size:14px;flex:1;color:var(--sub)">${p.n}</span></div>`).join("")}</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn btn-p" onclick="reset()">New Stand-up</button></div>`;
  show("done");
}
function reset(){clearAllFilters();clearInterval(tI);clearInterval(sI);skip=defSkip();idx=0;time=dur;paused=false;alerted=false;editing=false;
  const actives=T.filter(p=>!p.sd);const skips=T.filter(p=>p.sd);
  order=[...shuf(actives),...skips];skip=new Set(order.map((_,i)=>i>=actives.length?i:null).filter(i=>i!==null));renderReady();}
reset();
</script>
</body>
</html>
